[package]
name = "smolgen"
version = "0.1.0"
authors = ["Jason Ozias <jason.g.ozias@gmail.com>", "Alloy Contributors"]
categories = ["development-tools", "development-tools::build-utils"]
description = "Generate 'cargo:rustc-env' instructions via 'build.rs' for use in your code via the 'env!' macro"
documentation = "https://docs.rs/smolgen"
edition = "2024"
keywords = ["cargo", "instructions", "build", "tool"]
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/alloy-rs/smolgen"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
allow_remote = ["gix?/blocking-http-transport-reqwest-rust-tls"]
build = ["dep:time"]
cargo = []
cargo_metadata = ["dep:cargo_metadata", "dep:regex", "cargo"]
emit_and_set = []
git2 = ["dep:git2-rs", "dep:time"]
gitcl = ["dep:time"]
gix = ["dep:gix", "dep:time"]
rustc = []
si = ["dep:sysinfo"]
vcs_info = []
pretty = ["dep:convert_case"]
color = ["pretty", "dep:console"]
header = ["pretty", "dep:console", "dep:rand"]
rkyv = ["pretty", "dep:rkyv"]
serde = ["pretty", "dep:serde"]
trace = ["pretty", "dep:tracing"]

[dependencies]
bon = "3.9.3"
cargo_metadata = { version = "0.23.1", optional = true }
console = { version = "0.16.4", optional = true }
convert_case = { version = "0.11.0", optional = true }
git2-rs = { version = "0.21.0", package = "git2", default-features = false, optional = true }
gix = { version = "0.87.1", default-features = false, features = [
    "revision",
    "worktree-mutation",
    "blocking-network-client",
    "interrupt",
    "status",
    "dirwalk",
    "sha1",
], optional = true }
rand = { version = "0.10.2", optional = true }
regex = { version = "1.13.1", optional = true }
rkyv = { version = "0.8.18", features = ["std"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
sysinfo = { version = "0.39.6", optional = true }
time = { version = "0.3.55", features = [
    "formatting",
    "local-offset",
    "parsing",
], optional = true }
tracing = { version = "0.1.44", features = [
    "max_level_trace",
    "release_max_level_trace",
], optional = true }

[dev-dependencies]
gix = { version = "0.87.1", default-features = false, features = [
    "revision",
    "worktree-mutation",
    "blocking-network-client",
    "sha1",
] }
rand = "0.10.2"
regex = "1.13.1"
serde_json = "1.0.151"
serial_test = "4.0.1"
temp-env = "0.3.6"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
